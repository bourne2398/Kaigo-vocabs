<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kaigo Vocabs">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="Active recall flashcards for Japanese caregiving (介護) vocabulary">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="icon" type="image/svg+xml" sizes="any" href="/icon.svg">
  <title>Kaigo Vocabs Flashcards</title>
  <style>
    :root {
      --bg: #0b1220;
      --card: #1e293b;
      --card-border: #334155;
      --primary: #3b82f6;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #60a5fa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
      background: var(--bg);
      min-height: 100vh;
      color: var(--text);
      padding-bottom: 24px;
    }
    .app-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(11, 18, 32, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #1e293b;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .home-btn {
      width: 40px; height: 40px;
      border-radius: 50%;
      border: none;
      background: #1e293b;
      color: var(--text);
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .app-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .app-title span {
      background: var(--primary);
      color: white;
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 700;
    }
    #selectionScreen {
      padding: 20px 16px;
      max-width: 520px;
      margin: 0 auto;
    }
    .selection-title {
      text-align: center;
      margin-bottom: 20px;
    }
    .selection-title h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .selection-title p {
      color: var(--muted);
      font-size: 0.9rem;
    }
    .day-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    @media (min-width: 420px) {
      .day-grid { grid-template-columns: repeat(3, 1fr); }
    }
    .day-btn {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 18px 12px;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .day-btn:active {
      transform: scale(0.97);
      border-color: var(--primary);
    }
    .day-btn .count {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--muted);
    }
    .day-btn.all {
      grid-column: 1 / -1;
      background: linear-gradient(135deg, #1d4ed8, #3b82f6);
      border: none;
      color: white;
    }
    .day-btn.all .count { color: rgba(255,255,255,0.85); }
    #studyScreen {
      display: none;
      max-width: 520px;
      margin: 0 auto;
      padding: 12px 16px 40px;
    }
    .study-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding: 0 4px;
    }
    .study-meta .label {
      font-weight: 700;
      font-size: 1rem;
    }
    .study-meta .count-label {
      color: var(--muted);
      font-size: 0.85rem;
    }
    .card-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .flash-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px 18px 18px;
      position: relative;
      min-height: 140px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .flash-card .level {
      position: absolute;
      top: 12px;
      right: 14px;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--muted);
      background: #0f172a;
      padding: 3px 8px;
      border-radius: 8px;
    }
    .flash-card .jp-row {
      text-align: center;
      margin-bottom: 10px;
    }
    .flash-card .reading {
      display: block;
      font-size: 0.95rem;
      color: var(--accent);
      font-weight: 500;
      margin-bottom: 2px;
    }
    .flash-card .jp {
      font-size: 1.9rem;
      font-weight: 700;
      line-height: 1.3;
      word-break: break-all;
    }
    .flash-card .en {
      text-align: center;
      font-size: 1.2rem;
      font-weight: 500;
      color: #cbd5e1;
      margin-top: 6px;
    }
    .flash-card .speak-btn {
      position: absolute;
      bottom: 12px;
      left: 14px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: #334155;
      color: #e2e8f0;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    .flash-card .speak-btn:active {
      background: var(--primary);
    }
    .flash-card .speak-btn.speaking {
      background: var(--primary);
      animation: pulse 0.9s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    .empty-msg {
      text-align: center;
      color: var(--muted);
      padding: 40px 20px;
    }
    footer {
      text-align: center;
      color: #475569;
      font-size: 0.75rem;
      margin-top: 28px;
      padding-bottom: 20px;
    }
  </style>
</head>
<body>
  <header class="app-header">
    <button class="home-btn" id="homeBtn" onclick="showSelection()" title="Home">🏠</button>
    <div class="app-title">
      <span>介</span>
      介護 Vocabs
    </div>
  </header>

  <div id="selectionScreen">
    <div class="selection-title">
      <h1>Choose what to study</h1>
      <p>Select a day or study everything</p>
    </div>
    <button class="day-btn all" onclick="startStudy(0)">
      All Days
      <span class="count" id="countAll">291 cards</span>
    </button>
    <div class="day-grid" id="dayGrid" style="margin-top:12px">
    </div>
  </div>

  <div id="studyScreen">
    <div class="study-meta">
      <div class="label" id="currentDayLabel">Day 1</div>
      <div class="count-label" id="cardCountLabel">0 cards</div>
    </div>
    <div class="card-list" id="cardList">
    </div>
  </div>

  <footer>Kaigo Vocabulary · Scroll & practice</footer>

  <script>
    let vocabData = [];
    let currentDay = 0;

    async function loadVocab() {
      try {
        const days = [1,2,3,4,5,6,7];
        const promises = days.map(d => fetch('/vocab-day' + d + '.json').then(r => r.json()));
        const results = await Promise.all(promises);
        vocabData = results.flat();
        console.log('Loaded', vocabData.length, 'cards');
        buildSelection();
      } catch (e) {
        console.error('Failed to load vocab', e);
        document.getElementById('dayGrid').innerHTML =
          '<p style="color:#f87171;text-align:center;grid-column:1/-1">Failed to load data. Please refresh.</p>';
      }
    }

    function buildSelection() {
      const grid = document.getElementById('dayGrid');
      grid.innerHTML = '';
      const days = {};
      vocabData.forEach(v => {
        if (!days[v.day]) days[v.day] = 0;
        days[v.day]++;
      });
      Object.keys(days).sort((a,b) => a - b).forEach(day => {
        const btn = document.createElement('button');
        btn.className = 'day-btn';
        btn.onclick = () => startStudy(parseInt(day));
        btn.innerHTML = `Day ${day}<span class="count">${days[day]} cards</span>`;
        grid.appendChild(btn);
      });
      document.getElementById('countAll').textContent = vocabData.length + ' cards';
    }

    function startStudy(day) {
      currentDay = day;
      const cards = day === 0
        ? [...vocabData]
        : vocabData.filter(v => v.day === day);

      document.getElementById('selectionScreen').style.display = 'none';
      document.getElementById('studyScreen').style.display = 'block';
      document.getElementById('currentDayLabel').textContent =
        day === 0 ? 'All Days' : 'Day ' + day;
      document.getElementById('cardCountLabel').textContent = cards.length + ' cards';

      const list = document.getElementById('cardList');
      list.innerHTML = '';

      if (cards.length === 0) {
        list.innerHTML = '<div class="empty-msg">No cards found.</div>';
        return;
      }

      cards.forEach((card) => {
        const el = document.createElement('div');
        el.className = 'flash-card';

        const showReading = card.reading &&
          card.reading !== card.jp &&
          !/^[ァ-ンー・\\s\\dA-Za-z]+$/.test(card.jp.replace(/[（）()]/g, ''));

        el.innerHTML = `
          <div class="level">L${card.day || 1}</div>
          <div class="jp-row">
            ${showReading ? `<span class="reading">${card.reading}</span>` : ''}
            <div class="jp">${card.jp}</div>
          </div>
          <div class="en">${card.en}</div>
          <button class="speak-btn" data-jp="${card.jp.replace(/"/g, '"')}" title="Play pronunciation">🔊</button>
        `;
        list.appendChild(el);
      });

      list.querySelectorAll('.speak-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          speak(btn.dataset.jp, btn);
        });
      });

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showSelection() {
      document.getElementById('studyScreen').style.display = 'none';
      document.getElementById('selectionScreen').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function speak(text, btn) {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ja-JP';
      u.rate = 0.9;
      if (btn) {
        btn.classList.add('speaking');
        u.onend = u.onerror = () => btn.classList.remove('speaking');
      }
      window.speechSynthesis.speak(u);
    }

    loadVocab();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((reg) => console.log('SW registered', reg.scope))
          .catch((err) => console.log('SW failed', err));
      });
    }
  </script>
</body>
</html>
